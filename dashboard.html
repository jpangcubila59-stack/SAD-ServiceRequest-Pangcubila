<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Service Request System - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ICT Service Request System</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn" class="btn btn-danger">Logout</button>
            </div>
        </header>

        <!-- Dashboard Stats -->
        <section class="dashboard-stats">
            <div class="stat-card">
                <h3>Total Requests</h3>
                <p id="totalRequests">0</p>
            </div>
            <div class="stat-card pending">
                <h3>Pending</h3>
                <p id="pendingRequests">0</p>
            </div>
            <div class="stat-card in-progress">
                <h3>In Progress</h3>
                <p id="inProgressRequests">0</p>
            </div>
            <div class="stat-card completed">
                <h3>Completed</h3>
                <p id="completedRequests">0</p>
            </div>
        </section>

        <!-- Controls -->
        <div class="controls">
            <button id="newRequestBtn" class="btn btn-primary">New Request</button>
            <div class="search-filters">
                <input type="text" id="searchInput" placeholder="Search by name or description...">
                <select id="statusFilter">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="priorityFilter">
                    <option value="All">All Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
        </div>

        <!-- Requests Table -->
        <section class="requests-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requester</th>
                        <th>Department</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading requests...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <!-- Modal for Create/Edit -->
    <div id="requestModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">New Service Request</h2>
            <form id="requestForm">
                <input type="hidden" id="requestId">
                
                <div class="form-group">
                    <label for="requesterName">Requester Name *</label>
                    <input type="text" id="requesterName" required>
                </div>
                
                <div class="form-group">
                    <label for="department">Department *</label>
                    <input type="text" id="department" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Computer Repair">Computer Repair</option>
                        <option value="Software Installation">Software Installation</option>
                        <option value="Network Problem">Network Problem</option>
                        <option value="Printer Problem">Printer Problem</option>
                        <option value="Account Concern">Account Concern</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="priority">Priority *</label>
                    <select id="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Request</button>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Confirm Deletion</h2>
            <p>Are you sure you want to delete this request?</p>
            <div class="modal-actions">
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
                <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
